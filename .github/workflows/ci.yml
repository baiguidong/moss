name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.10'
  NODE_VERSION: '22.22.2'
  SERVER_NODE_VERSION: '22.23.1'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd adapters
          bun install --frozen-lockfile --cwd ui

      - name: Type checks
        run: |
          bun run --cwd admin check
          bun run --cwd server check
          bun run --cwd ui check

      - name: Tests
        run: |
          bun run test
          bun run --cwd server test
          bun run --cwd adapters test
          bun test --cwd ui tests

      - name: Build all Node targets
        run: bun run build:node

  package-macos-arm64:
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd adapters
          bun install --frozen-lockfile --cwd ui

      - name: Build and verify macOS arm64 installers
        run: bun run --cwd ui dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moss-macos-arm64-unsigned
          path: |
            ui/dist/installers/*.dmg
            ui/dist/installers/*.zip
            ui/dist/installers/latest-mac.yml
            ui/dist/installers/*.blockmap
          if-no-files-found: error
          retention-days: 7
  package-windows-x64:
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd adapters
          bun install --frozen-lockfile --cwd ui

      - name: Build and verify Windows x64 installers
        run: bun run --cwd ui dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moss-windows-x64-unsigned
          path: |
            ui/dist/installers/*.exe
            ui/dist/installers/latest.yml
            ui/dist/installers/*.blockmap
          if-no-files-found: error
          retention-days: 7

  package-server-linux-amd64:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.SERVER_NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd adapters

      - name: Validate deployment scripts
        run: |
          bash -n deploy/package-server.sh
          bash -n deploy/install-server.sh
          bash deploy/install-server.test.sh
          node --check scripts/docker-build-runtime.mjs

      - name: Build and verify Server package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          OUTPUT_DIR=dist/server-ci
          RUNTIME_IMAGE="moss-runtime:$VERSION-amd64"
          deploy/package-server.sh "$VERSION" amd64 "$OUTPUT_DIR"
          bun scripts/docker-build-runtime.mjs \
            --tag "$RUNTIME_IMAGE" \
            --platform linux/amd64 \
            --node-version "$SERVER_NODE_VERSION" \
            --load
          docker run --rm "$RUNTIME_IMAGE" node --no-warnings -e \
            "require('node:sqlite'); require('sharp')"
          docker run --rm --user 10001:10001 -e HOME=/tmp/moss-home \
            "$RUNTIME_IMAGE" node --version
          docker save "$RUNTIME_IMAGE" | gzip -1 \
            > "$OUTPUT_DIR/moss-runtime-$VERSION-linux-amd64.tar.gz"
          (
            cd "$OUTPUT_DIR"
            sha256sum \
              "moss-server-$VERSION-linux-amd64.tar.gz" \
              "moss-runtime-$VERSION-linux-amd64.tar.gz" \
              > SHA256SUMS-server
          )
          sed \
            -e "s|@@MOSS_RELEASE_TAG@@|v$VERSION|g" \
            -e "s|@@MOSS_REPOSITORY@@|$GITHUB_REPOSITORY|g" \
            deploy/install-server.sh > "$OUTPUT_DIR/install-server.sh"
          chmod +x "$OUTPUT_DIR/install-server.sh"
          (cd "$OUTPUT_DIR" && sha256sum -c SHA256SUMS-server)
          tar -tzf "$OUTPUT_DIR/moss-server-$VERSION-linux-amd64.tar.gz" \
            > "$OUTPUT_DIR/server-contents.txt"
          grep -Fxq 'moss-server/app/bin/moss-server.mjs' "$OUTPUT_DIR/server-contents.txt"
          grep -Fxq 'moss-server/app/bin/moss-session-runner.mjs' "$OUTPUT_DIR/server-contents.txt"
          ! grep -Fq 'cli-node.js' "$OUTPUT_DIR/server-contents.txt"
          ! tar -tvzf "$OUTPUT_DIR/moss-server-$VERSION-linux-amd64.tar.gz" \
            | grep -Eq '^[lh]'

      - name: Upload Server artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moss-server-linux-amd64
          path: |
            dist/server-ci/moss-server-*.tar.gz
            dist/server-ci/moss-runtime-*.tar.gz
            dist/server-ci/SHA256SUMS-server
            dist/server-ci/install-server.sh
          if-no-files-found: error
          retention-days: 7
