name: Build Moss Release Package

on:
  workflow_dispatch:
    inputs:
      runtime_tests:
        description: Run Docker/browser runtime tests on CI (disable when validating on a designated deployment machine)
        type: boolean
        default: true
      include_server:
        description: Also build the versioned Server image and admin UI
        type: boolean
        default: false
      version:
        description: WebUI version (empty generates a unique prerelease)
        type: string
        default: ''
      publish:
        description: Publish the versioned WebUI image to GHCR
        type: boolean
        default: true
  workflow_call:
    inputs:
      runtime_tests:
        type: boolean
        default: true
      include_server:
        type: boolean
        default: false
      version:
        type: string
        required: true
      source_ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: true
      latest:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: webui-package-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  webui-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Select release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-0.0.1-webui.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}}"
          node scripts/sync-ui-version.mjs "$version"
          version="${version#v}"
          [[ "$version" != *+* ]] || { echo 'Docker release versions must not contain + metadata'; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moss-webui:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Verify packaging and deployment contracts
        run: |
          node --test scripts/docker-webui.test.mjs cloud/tests/*.test.mjs
          bash deploy/server/scripts/validate.sh
      - name: Build Linux AMD64 image on GitHub
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: node scripts/docker-webui.mjs build --platform linux/amd64 --tag "$IMAGE" --version "$VERSION" --progress plain
      - name: Install browser validation tools
        if: ${{ inputs.runtime_tests }}
        run: |
          npm install --prefix "$RUNNER_TEMP/webui-browser" --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/webui-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify real browser and container restart
        if: ${{ inputs.runtime_tests }}
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          MOSS_WEB_TEST_BROWSER: chromium
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/webui-browser/node_modules/playwright/index.mjs"
          node scripts/test-webui-image.mjs "$IMAGE"
      - name: Verify per-user cloud computers and in-place program upgrade
        if: ${{ inputs.runtime_tests }}
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/webui-browser/node_modules/playwright/index.mjs"
          node scripts/test-cloud-image.mjs "$IMAGE"
      - name: Export offline WebUI package and Server deployment
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          node scripts/docker-webui.mjs package --skip-build --platform linux/amd64 --tag "$IMAGE" --version "$VERSION" --output-dir dist/webui-release
          MOSS_WEB_PACKAGE_IMAGE="$IMAGE" deploy/server/package.sh "$VERSION" dist/webui-release
      - name: Publish validated image
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          PUBLISH_LATEST: ${{ inputs.latest || false }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          if [[ "$PUBLISH_LATEST" == true ]]; then
            latest="${IMAGE%:*}:latest"
            docker tag "$IMAGE" "$latest"
            docker push "$latest"
          fi
      - name: Upload deployment packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moss-webui-linux-amd64-${{ steps.release.outputs.version }}
          path: dist/webui-release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/webui-validation
          if-no-files-found: ignore
          retention-days: 14
      - name: Deployment information
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          printf '### Linux AMD64 WebUI\n\nImage: `%s`\n\nEnable with `MOSS_WEB_ENABLED=1 MOSS_WEB_IMAGE=%s ./install.sh`.\n' "$IMAGE" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  server-linux-amd64:
    if: ${{ inputs.include_server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build Server and admin UI
        id: server
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-0.0.1-webui.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}}"
          version="${version#v}"
          node scripts/sync-ui-version.mjs "$version"
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun run --cwd admin check
          bun run --cwd server check
          deploy/server/prepare-image-context.sh "$version" amd64 dist/server-image
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moss-server:$version"
          docker buildx build --platform linux/amd64 --build-arg "MOSS_VERSION=$version" --tag "$image" --load -f docker/server/Dockerfile .
          mkdir -p dist/server-release
          docker save "$image" | gzip > dist/server-release/moss-server-linux-amd64.tar.gz
          (cd dist/server-release && sha256sum moss-server-linux-amd64.tar.gz > SHA256SUMS)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish versioned Server image
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.server.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moss-server-linux-amd64-${{ steps.server.outputs.version }}
          path: dist/server-release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
