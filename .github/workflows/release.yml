name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.10'
  NODE_VERSION: '22.22.2'
  SERVER_NODE_VERSION: '22.23.1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?$'
          if [[ ! "$REQUESTED_TAG" =~ $tag_pattern ]]; then
            echo "Invalid release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" >/dev/null
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$REQUESTED_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Sync release version
        run: node scripts/sync-ui-version.mjs "${{ needs.prepare.outputs.tag }}"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd ui

      - name: Run release quality gate
        run: |
          bun run --cwd admin check
          bun run --cwd server check
          bun run --cwd ui check
          bun run test
          bun run --cwd server test
          bun run --cwd ui test
          bun run build:node

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, quality]
    steps:
      - name: Create clean GitHub Release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft --prerelease="$IS_PRERELEASE" --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            while IFS= read -r asset; do
              [[ -z "$asset" ]] || gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            release_flags=(--draft --title "$RELEASE_TAG")
            [[ "$IS_PRERELEASE" == true ]] && release_flags+=(--prerelease)
            gh release create "$RELEASE_TAG" "${release_flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  build-macos-arm64:
    runs-on: macos-latest
    needs: [prepare, create-release]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Sync release version
        run: node scripts/sync-ui-version.mjs "${{ needs.prepare.outputs.tag }}"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd ui

      - name: Build and verify macOS package
        run: bun run --cwd ui release:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=()
          for asset in ui/dist/installers/*.dmg ui/dist/installers/*.zip ui/dist/installers/latest-mac.yml ui/dist/installers/*.blockmap; do
            assets+=("$asset")
          done
          [[ ${#assets[@]} -gt 0 ]] || { echo 'No macOS release assets found' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build-windows-x64:
    runs-on: windows-latest
    needs: [prepare, create-release]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Sync release version
        run: node scripts/sync-ui-version.mjs "${{ needs.prepare.outputs.tag }}"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin
          bun install --frozen-lockfile --cwd ui

      - name: Build and verify Windows package
        run: bun run --cwd ui release:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=()
          for asset in ui/dist/installers/*.exe ui/dist/installers/latest.yml ui/dist/installers/*.blockmap; do
            assets+=("$asset")
          done
          [[ ${#assets[@]} -gt 0 ]] || { echo 'No Windows release assets found' >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build-server-linux-amd64:
    runs-on: ubuntu-latest
    needs: [prepare, create-release]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.SERVER_NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sync release version
        run: node scripts/sync-ui-version.mjs "${{ needs.prepare.outputs.tag }}"

      - name: Install server build dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd admin

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/server/prepare-image-context.sh
          bash deploy/server/scripts/validate.sh
          node --check scripts/docker-build-runtime.mjs

      - name: Build Server and runtime images
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MOSS_SERVER_NODE_VERSION: ${{ env.SERVER_NODE_VERSION }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          RUNTIME_TAG_VERSION="${VERSION//+/_}"
          RUNTIME_IMAGE="moss-runtime:$RUNTIME_TAG_VERSION-amd64"
          SERVER_IMAGE="moss-server:$RUNTIME_TAG_VERSION-amd64"
          deploy/server/prepare-image-context.sh "$VERSION" amd64 dist/server-image
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "MOSS_VERSION=$VERSION" \
            --tag "$SERVER_IMAGE" \
            --load \
            -f docker/server/Dockerfile .
          bun scripts/docker-build-runtime.mjs \
            --tag "$RUNTIME_IMAGE" \
            --platform linux/amd64 \
            --node-version "$SERVER_NODE_VERSION" \
            --load
          docker run --rm "$RUNTIME_IMAGE" node --no-warnings -e \
            "require('node:sqlite'); require('sharp')"
          docker run --rm "$RUNTIME_IMAGE" python3 --version
          docker run --rm "$RUNTIME_IMAGE" git --version
          docker run --rm "$RUNTIME_IMAGE" rg --version
          docker run --rm --user 10001:10001 -e HOME=/tmp/moss-home \
            "$RUNTIME_IMAGE" node --version
          docker run --rm --entrypoint /opt/moss/node/bin/node \
            "$SERVER_IMAGE" --no-warnings -e \
            "require('node:sqlite'); require('sharp')"

      - name: Publish Server Docker images
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TAG_VERSION="${VERSION//+/_}"
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          LOCAL_SERVER_IMAGE="moss-server:$TAG_VERSION-amd64"
          LOCAL_RUNTIME_IMAGE="moss-runtime:$TAG_VERSION-amd64"
          SERVER_IMAGE="ghcr.io/$IMAGE_OWNER/moss-server"
          RUNTIME_IMAGE="ghcr.io/$IMAGE_OWNER/moss-runtime"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_SERVER_IMAGE" "$SERVER_IMAGE:$TAG_VERSION"
          docker tag "$LOCAL_RUNTIME_IMAGE" "$RUNTIME_IMAGE:$TAG_VERSION"
          docker push "$SERVER_IMAGE:$TAG_VERSION"
          docker push "$RUNTIME_IMAGE:$TAG_VERSION"
          if [[ "$IS_PRERELEASE" != true ]]; then
            docker tag "$LOCAL_SERVER_IMAGE" "$SERVER_IMAGE:latest"
            docker tag "$LOCAL_RUNTIME_IMAGE" "$RUNTIME_IMAGE:latest"
            docker push "$SERVER_IMAGE:latest"
            docker push "$RUNTIME_IMAGE:latest"
          fi

      - name: Package and upload Server Compose deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          OUTPUT_DIR=dist/server-compose
          deploy/server/package.sh "$VERSION" "$OUTPUT_DIR"
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/moss-server-compose-$VERSION.tar.gz" \
            "$OUTPUT_DIR/moss-server-compose-$VERSION.tar.gz.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-macos-arm64, build-windows-x64, build-server-linux-amd64]
    steps:
      - name: Verify complete release asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          [[ $(wc -l <<<"$assets" | tr -d ' ') -eq 11 ]]
          grep -Fxq "Moss-$VERSION-arm64.dmg" <<<"$assets"
          grep -Fxq "Moss-$VERSION-arm64.dmg.blockmap" <<<"$assets"
          grep -Fxq "Moss-$VERSION-arm64-mac.zip" <<<"$assets"
          grep -Fxq "Moss-$VERSION-arm64-mac.zip.blockmap" <<<"$assets"
          grep -Fxq "Moss-Setup-$VERSION-x64.exe" <<<"$assets"
          grep -Fxq "Moss-Setup-$VERSION-x64.exe.blockmap" <<<"$assets"
          grep -Fxq "Moss-Portable-$VERSION-x64.exe" <<<"$assets"
          grep -Fxq 'latest-mac.yml' <<<"$assets"
          grep -Fxq 'latest.yml' <<<"$assets"
          grep -Fxq "moss-server-compose-$VERSION.tar.gz" <<<"$assets"
          grep -Fxq "moss-server-compose-$VERSION.tar.gz.sha256" <<<"$assets"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
