<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file: https:; img-src 'self' data: blob: file: https:; media-src 'self' data: blob: file: https:; font-src 'self' data: blob: file: https:; connect-src 'self' data: blob: file: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; frame-src 'self' https:;">
  <title>JSON 工具箱</title>
  <script type="application/ld+json">
  {
    "@context": "urn:goose.ai:schema",
    "@type": "GooseApp",
    "name": "json-tool",
    "icon": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>",
    "description": "JSON 工具箱 - 格式化、压缩、校验、树形折叠、转义与排序，纯本地处理",
    "width": 1024,
    "height": 720,
    "resizable": true,
    "mcpServers": ["apps"],
    "runtime": {
      "hostApi": "window.mossApp",
      "capabilities": []
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --card: #151c2c;
      --card-hover: #1c2438;
      --border: #2a3548;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --ok: #22c55e;
      --key: #93c5fd;
      --str: #86efac;
      --num: #fca5a5;
      --bool: #c4b5fd;
      --null: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header h1 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .header h1 .icon { font-size: 20px; }
    .status { font-size: 12px; color: var(--text-muted); }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    button, select {
      font-family: inherit; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    button { padding: 7px 13px; }
    select { padding: 7px 10px; }
    button:hover { background: var(--card-hover); border-color: var(--primary); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    .main { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane-head { padding: 8px 16px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .pane-head button { padding: 3px 8px; font-size: 11px; margin-left: auto; }
    textarea {
      flex: 1; resize: none; padding: 14px 16px; line-height: 1.5; font-size: 13px;
      font-family: 'SF Mono', Menlo, Consolas, monospace; width: 100%; outline: none;
      background: var(--bg); border: none; color: var(--text);
    }
    .tree { flex: 1; overflow: auto; padding: 12px 16px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; line-height: 1.55; }
    .tree.empty { color: var(--text-muted); font-family: inherit; }
    .node { white-space: pre; }
    .toggle { cursor: pointer; display: inline-block; width: 14px; color: var(--text-muted); user-select: none; }
    .collapsed > .children { display: none; }
    .collapsed > .summary::after { content: attr(data-summary); color: var(--text-muted); }
    .children { display: block; }
    .k { color: var(--key); }
    .s { color: var(--str); }
    .n { color: var(--num); }
    .b { color: var(--bool); }
    .nl { color: var(--null); }
    .p { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">🧬</span> JSON 工具箱</h1>
    <span class="status" id="status">等待输入</span>
  </div>
  <div class="toolbar">
    <button class="primary" id="formatBtn">格式化</button>
    <button id="minifyBtn">压缩</button>
    <label style="font-size:12px;color:var(--text-muted)">缩进</label>
    <select id="indent">
      <option value="2">2 空格</option>
      <option value="4">4 空格</option>
      <option value="\t">Tab</option>
    </select>
    <button id="sortBtn">键排序</button>
    <button id="escapeBtn">转义</button>
    <button id="unescapeBtn">去转义</button>
    <button id="sampleBtn">示例</button>
    <button id="clearBtn">清空</button>
  </div>
  <div class="main">
    <div class="pane">
      <div class="pane-head">输入 <span id="inputInfo"></span> <button id="pasteBtn">粘贴</button></div>
      <textarea id="input" placeholder='粘贴或输入 JSON…' spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">树形视图 <span id="treeInfo"></span> <button id="expandAll">展开</button><button id="collapseAll" style="margin-left:0">折叠</button><button id="copyBtn" style="margin-left:0">复制</button></div>
      <div class="tree empty" id="tree">解析成功后将在此显示可折叠的树形结构</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let lastParsed = null;

    function setStatus(text, cls) {
      const el = $('status');
      el.textContent = text;
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    function getIndent() {
      const v = $('indent').value;
      return v === '\\t' ? '\t' : parseInt(v, 10);
    }

    function parseInput() {
      const raw = $('input').value.trim();
      if (!raw) { setStatus('等待输入'); lastParsed = null; return { ok: false }; }
      try {
        lastParsed = JSON.parse(raw);
        setStatus('有效 JSON', 'ok');
        return { ok: true, value: lastParsed };
      } catch (e) {
        lastParsed = null;
        const m = /position (\d+)/.exec(e.message);
        let extra = '';
        if (m) {
          const pos = parseInt(m[1], 10);
          const before = raw.slice(0, pos);
          const line = before.split('\n').length;
          const col = pos - before.lastIndexOf('\n');
          extra = `（第 ${line} 行，第 ${col} 列）`;
        }
        setStatus('无效 JSON：' + e.message + extra, 'err');
        return { ok: false };
      }
    }

    function sortKeys(obj) {
      if (Array.isArray(obj)) return obj.map(sortKeys);
      if (obj && typeof obj === 'object') {
        const out = {};
        Object.keys(obj).sort().forEach((k) => { out[k] = sortKeys(obj[k]); });
        return out;
      }
      return obj;
    }

    function format() {
      const r = parseInput();
      if (!r.ok) return;
      $('input').value = JSON.stringify(r.value, null, getIndent());
      renderTree(r.value);
      updateInfo();
    }

    function minify() {
      const r = parseInput();
      if (!r.ok) return;
      $('input').value = JSON.stringify(r.value);
      renderTree(r.value);
      updateInfo();
    }

    function sort() {
      const r = parseInput();
      if (!r.ok) return;
      const sorted = sortKeys(r.value);
      $('input').value = JSON.stringify(sorted, null, getIndent());
      lastParsed = sorted;
      renderTree(sorted);
      updateInfo();
    }

    function escapeStr() {
      const raw = $('input').value;
      if (!raw) return;
      $('input').value = JSON.stringify(raw);
      setStatus('已转义为 JSON 字符串', 'ok');
    }

    function unescapeStr() {
      const raw = $('input').value.trim();
      if (!raw) return;
      try {
        const v = JSON.parse(raw);
        if (typeof v !== 'string') { setStatus('去转义要求输入本身是一个 JSON 字符串', 'err'); return; }
        $('input').value = v;
        setStatus('已去转义', 'ok');
        parseInput();
      } catch (e) {
        setStatus('去转义失败：' + e.message, 'err');
      }
    }

    // ---- Tree rendering (DOM-based, no innerHTML injection) ----
    function valueSpan(val) {
      const span = document.createElement('span');
      if (val === null) { span.className = 'nl'; span.textContent = 'null'; }
      else if (typeof val === 'string') { span.className = 's'; span.textContent = JSON.stringify(val); }
      else if (typeof val === 'number') { span.className = 'n'; span.textContent = String(val); }
      else if (typeof val === 'boolean') { span.className = 'b'; span.textContent = String(val); }
      return span;
    }

    function buildNode(val, keyName, depth) {
      const node = document.createElement('div');
      node.className = 'node';
      node.style.paddingLeft = depth === 0 ? '0' : '16px';

      const isArr = Array.isArray(val);
      const isObj = val && typeof val === 'object';

      if (isObj) {
        const header = document.createElement('div');
        const toggle = document.createElement('span');
        toggle.className = 'toggle';
        toggle.textContent = '▾';
        header.appendChild(toggle);

        if (keyName !== null) {
          const k = document.createElement('span');
          k.className = 'k';
          k.textContent = JSON.stringify(keyName) + ': ';
          header.appendChild(k);
        }
        const open = document.createElement('span');
        open.className = 'p';
        const count = isArr ? val.length : Object.keys(val).length;
        open.textContent = isArr ? '[' : '{';
        header.appendChild(open);

        const summary = document.createElement('span');
        summary.className = 'summary p';
        summary.setAttribute('data-summary', ` … ${count} 项 ${isArr ? ']' : '}'}`);
        header.appendChild(summary);

        node.appendChild(header);

        const children = document.createElement('div');
        children.className = 'children';
        const entries = isArr ? val.map((v, i) => [i, v]) : Object.entries(val);
        entries.forEach(([k, v]) => {
          children.appendChild(buildNode(v, isArr ? null : k, depth + 1));
        });
        const close = document.createElement('div');
        close.className = 'p';
        close.textContent = isArr ? ']' : '}';
        children.appendChild(close);
        node.appendChild(children);

        toggle.onclick = () => {
          node.classList.toggle('collapsed');
          toggle.textContent = node.classList.contains('collapsed') ? '▸' : '▾';
        };
      } else {
        if (keyName !== null) {
          const k = document.createElement('span');
          k.className = 'k';
          k.textContent = JSON.stringify(keyName) + ': ';
          node.appendChild(k);
        }
        node.appendChild(valueSpan(val));
      }
      return node;
    }

    function renderTree(val) {
      const tree = $('tree');
      tree.innerHTML = '';
      tree.classList.remove('empty');
      tree.appendChild(buildNode(val, null, 0));
    }

    function updateInfo() {
      const raw = $('input').value;
      $('inputInfo').textContent = raw ? `${raw.length} 字符 · ${raw.split('\n').length} 行` : '';
      if (lastParsed !== null) {
        $('treeInfo').textContent = '';
      }
    }

    $('formatBtn').onclick = format;
    $('minifyBtn').onclick = minify;
    $('sortBtn').onclick = sort;
    $('escapeBtn').onclick = escapeStr;
    $('unescapeBtn').onclick = unescapeStr;
    $('clearBtn').onclick = () => {
      $('input').value = '';
      $('tree').innerHTML = '解析成功后将在此显示可折叠的树形结构';
      $('tree').classList.add('empty');
      lastParsed = null;
      setStatus('等待输入');
      updateInfo();
    };
    $('sampleBtn').onclick = () => {
      $('input').value = JSON.stringify({
        name: "moss",
        version: "1.0.0",
        features: ["apps", "cron", "agent"],
        config: { theme: "dark", nested: { level: 2, enabled: true, ratio: 3.14, note: null } },
        tags: []
      }, null, 2);
      format();
    };
    $('expandAll').onclick = () => {
      $('tree').querySelectorAll('.collapsed').forEach((n) => {
        n.classList.remove('collapsed');
        const t = n.querySelector('.toggle');
        if (t) t.textContent = '▾';
      });
    };
    $('collapseAll').onclick = () => {
      $('tree').querySelectorAll('.node').forEach((n) => {
        if (n.querySelector('.children') && n.style.paddingLeft !== '0px') {
          n.classList.add('collapsed');
          const t = n.querySelector('.toggle');
          if (t) t.textContent = '▸';
        }
      });
    };
    $('copyBtn').onclick = async () => {
      if (lastParsed === null) { setStatus('没有可复制的有效 JSON', 'err'); return; }
      try { await navigator.clipboard.writeText(JSON.stringify(lastParsed, null, getIndent())); setStatus('已复制格式化结果', 'ok'); }
      catch { setStatus('复制失败', 'err'); }
    };
    $('pasteBtn').onclick = async () => {
      try {
        const t = await navigator.clipboard.readText();
        $('input').value = t;
        format();
      } catch { setStatus('读取剪贴板失败', 'err'); }
    };

    let timer = null;
    $('input').addEventListener('input', () => {
      updateInfo();
      clearTimeout(timer);
      timer = setTimeout(() => {
        const r = parseInput();
        if (r.ok) renderTree(r.value);
      }, 300);
    });
  </script>
</body>
</html>
