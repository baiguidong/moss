<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file: https:; img-src 'self' data: blob: file: https:; media-src 'self' data: blob: file: https:; font-src 'self' data: blob: file: https:; connect-src 'self' data: blob: file: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; frame-src 'self' https:;">
  <title>AI 翻译台</title>
  <script type="application/ld+json">
  {
    "@context": "urn:goose.ai:schema",
    "@type": "GooseApp",
    "name": "ai-translator",
    "icon": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>",
    "description": "AI 翻译台 - 基于宿主 Agent 的流式多语言翻译，支持历史记录",
    "width": 960,
    "height": 720,
    "resizable": true,
    "mcpServers": ["apps"],
    "runtime": {
      "hostApi": "window.mossApp",
      "capabilities": ["agent", "storage"]
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --card: #151c2c;
      --card-hover: #1c2438;
      --border: #2a3548;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .header h1 .icon { font-size: 20px; }
    .status { font-size: 12px; color: var(--text-muted); }
    .status.on { color: var(--ok); }
    .status.err { color: var(--danger); }
    .banner {
      background: #422006; color: #fde68a; padding: 8px 20px; font-size: 12px;
      border-bottom: 1px solid var(--border); display: none;
    }
    .banner.show { display: block; }
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    label { font-size: 12px; color: var(--text-muted); }
    select, button, textarea {
      font-family: inherit; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 13px;
    }
    select { padding: 7px 10px; cursor: pointer; }
    button { padding: 8px 16px; cursor: pointer; transition: all 0.15s; }
    button:hover:not(:disabled) { background: var(--card-hover); border-color: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
    button.ghost { background: transparent; }
    .main { flex: 1; display: flex; min-height: 0; }
    .panes { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 20px; }
    .pane + .pane { border-top: 1px solid var(--border); }
    .pane-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    textarea {
      flex: 1; resize: none; padding: 12px 14px; line-height: 1.6; font-size: 14px;
      width: 100%; outline: none;
    }
    textarea:focus { border-color: var(--primary); }
    .output {
      flex: 1; padding: 12px 14px; line-height: 1.6; font-size: 14px; overflow-y: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    .output.empty { color: var(--text-muted); }
    .cursor::after { content: '▋'; color: var(--primary); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    .history {
      width: 280px; border-left: 1px solid var(--border); display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .history-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted); display: flex; align-items: center; }
    .history-head button { padding: 4px 8px; font-size: 11px; margin-left: auto; }
    .history-list { flex: 1; overflow-y: auto; }
    .hist-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .hist-item:hover { background: var(--card-hover); }
    .hist-item .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .hist-item .src { font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .empty-hint { padding: 20px 16px; font-size: 12px; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">🌐</span> AI 翻译台</h1>
    <span class="status" id="status">就绪</span>
  </div>
  <div class="banner" id="banner">未检测到 window.mossApp 宿主环境，翻译功能不可用（当前可能是纯浏览器预览）。</div>
  <div class="toolbar">
    <label>目标语言</label>
    <select id="target">
      <option value="英语">英语</option>
      <option value="简体中文">简体中文</option>
      <option value="日语">日语</option>
      <option value="韩语">韩语</option>
      <option value="法语">法语</option>
      <option value="德语">德语</option>
      <option value="西班牙语">西班牙语</option>
      <option value="俄语">俄语</option>
    </select>
    <label>语气</label>
    <select id="tone">
      <option value="自然流畅">自然流畅</option>
      <option value="正式书面">正式书面</option>
      <option value="口语随意">口语随意</option>
      <option value="技术精确">技术精确</option>
    </select>
    <button class="primary" id="translateBtn">翻译</button>
    <button id="cancelBtn" disabled>取消</button>
    <button class="ghost" id="swapBtn">清空</button>
  </div>
  <div class="main">
    <div class="panes">
      <div class="pane">
        <div class="pane-title">原文</div>
        <textarea id="input" placeholder="在此输入要翻译的文本…"></textarea>
      </div>
      <div class="pane">
        <div class="pane-title">译文 <button class="ghost" id="copyBtn" style="padding:2px 8px;font-size:11px;">复制</button></div>
        <div class="output empty" id="output">译文将显示在这里</div>
      </div>
    </div>
    <div class="history">
      <div class="history-head">历史记录 <button class="ghost" id="clearHist">清空</button></div>
      <div class="history-list" id="historyList"><div class="empty-hint">暂无记录</div></div>
    </div>
  </div>

  <script>
    const api = window.mossApp;
    const $ = (id) => document.getElementById(id);
    const HIST_KEY = 'translation-history';
    let currentRequestId = null;
    let unsub = null;
    let history = [];

    if (!api) $('banner').classList.add('show');

    function setStatus(text, cls) {
      const el = $('status');
      el.textContent = text;
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    async function loadHistory() {
      if (!api) return;
      try {
        const raw = await api.storage.getItem(HIST_KEY);
        history = raw ? JSON.parse(raw) : [];
      } catch { history = []; }
      renderHistory();
    }

    async function saveHistory() {
      if (!api) return;
      try { await api.storage.setItem(HIST_KEY, JSON.stringify(history.slice(0, 50))); } catch {}
    }

    function renderHistory() {
      const list = $('historyList');
      if (!history.length) { list.innerHTML = '<div class="empty-hint">暂无记录</div>'; return; }
      list.innerHTML = '';
      history.forEach((h, i) => {
        const div = document.createElement('div');
        div.className = 'hist-item';
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `→ ${h.target} · ${new Date(h.at).toLocaleString()}`;
        const src = document.createElement('div');
        src.className = 'src';
        src.textContent = h.source;
        div.appendChild(meta); div.appendChild(src);
        div.onclick = () => {
          $('input').value = h.source;
          $('target').value = h.target;
          const out = $('output');
          out.classList.remove('empty');
          out.textContent = h.result;
        };
        list.appendChild(div);
      });
    }

    function setTranslating(on) {
      $('translateBtn').disabled = on;
      $('cancelBtn').disabled = !on;
    }

    async function translate() {
      if (!api) { setStatus('宿主不可用', 'err'); return; }
      const text = $('input').value.trim();
      if (!text) { setStatus('请输入原文', 'err'); return; }
      const target = $('target').value;
      const tone = $('tone').value;

      const out = $('output');
      out.classList.remove('empty');
      out.textContent = '';
      out.classList.add('cursor');
      setTranslating(true);
      setStatus('翻译中…', 'on');

      const requestId = 'tr-' + Date.now();
      currentRequestId = requestId;

      const systemPrompt = '你是专业翻译引擎。只输出译文本身，不要解释、不要加引号、不要加任何前后缀。';
      const prompt = `请把下面的文本翻译成${target}，语气要求：${tone}。\n\n原文：\n${text}`;

      // Subscribe to streaming runtime events
      if (unsub) { unsub(); unsub = null; }
      unsub = api.onRuntimeEvent((ev) => {
        if (!ev || ev.requestId !== requestId) return;
        if (ev.type === 'agent:delta') {
          out.textContent = ev.text != null ? ev.text : (out.textContent + (ev.delta || ''));
        } else if (ev.type === 'agent:complete') {
          const finalText = (ev.text != null && ev.text !== '') ? ev.text : out.textContent;
          finishTranslation(finalText, { source: text, target });
        } else if (ev.type === 'agent:error') {
          out.classList.remove('cursor');
          setStatus('翻译失败：' + ((ev.error && ev.error.message) || '未知错误'), 'err');
          setTranslating(false);
          cleanup();
        } else if (ev.type === 'agent:cancelled') {
          out.classList.remove('cursor');
          setStatus('已取消', '');
          setTranslating(false);
          cleanup();
        }
      });

      try {
        const res = await api.agent.send({ prompt, systemPrompt, requestId, stream: true });
        if (res && res.ok === false) {
          out.classList.remove('cursor');
          setStatus('发送失败：' + ((res.error && res.error.message) || '未知'), 'err');
          setTranslating(false);
          cleanup();
        }
      } catch (e) {
        out.classList.remove('cursor');
        setStatus('异常：' + e.message, 'err');
        setTranslating(false);
        cleanup();
      }
    }

    function finishTranslation(result, info) {
      const out = $('output');
      out.classList.remove('cursor');
      out.textContent = result;
      setStatus('完成', 'on');
      setTranslating(false);
      history.unshift({ source: info.source, target: info.target, result, at: Date.now() });
      history = history.slice(0, 50);
      saveHistory();
      renderHistory();
      cleanup();
    }

    function cleanup() {
      currentRequestId = null;
      if (unsub) { unsub(); unsub = null; }
    }

    async function cancel() {
      if (!api || !currentRequestId) return;
      try { await api.agent.cancel(currentRequestId); } catch {}
      setStatus('取消中…', '');
    }

    $('translateBtn').onclick = translate;
    $('cancelBtn').onclick = cancel;
    $('swapBtn').onclick = () => {
      $('input').value = '';
      const out = $('output');
      out.textContent = '译文将显示在这里';
      out.classList.add('empty');
      out.classList.remove('cursor');
      setStatus('就绪');
    };
    $('copyBtn').onclick = async () => {
      const t = $('output').textContent;
      if (!t || $('output').classList.contains('empty')) return;
      try { await navigator.clipboard.writeText(t); setStatus('已复制', 'on'); } catch { setStatus('复制失败', 'err'); }
    };
    $('clearHist').onclick = async () => {
      history = [];
      await saveHistory();
      renderHistory();
    };
    $('input').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); translate(); }
    });

    loadHistory();
  </script>
</body>
</html>
