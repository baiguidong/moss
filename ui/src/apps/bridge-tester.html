<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file: https:; img-src 'self' data: blob: file: https:; media-src 'self' data: blob: file: https:; font-src 'self' data: blob: file: https:; connect-src 'self' data: blob: file: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; frame-src 'self' https:;">
  <title>接口测试台</title>
  <script type="application/ld+json">
  {
    "@context": "urn:goose.ai:schema",
    "@type": "GooseApp",
    "name": "bridge-tester",
    "icon": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>",
    "description": "桥接接口测试台 - 逐一验证 window.mossApp 所有对外 API 是否正常",
    "width": 1024,
    "height": 768,
    "resizable": true,
    "mcpServers": ["apps"],
    "runtime": {
      "hostApi": "window.mossApp",
      "capabilities": ["storage", "files", "agent", "resources", "shell", "document", "preview", "log", "cron"]
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b1120;
      --card: #151c2c;
      --card-hover: #1c2438;
      --border: #2a3548;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --ok: #22c55e;
      --warn: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .header h1 .icon { font-size: 22px; }

    .summary { font-size: 13px; color: var(--text-muted); margin-right: 8px; }
    .summary b.ok { color: var(--ok); }
    .summary b.fail { color: var(--danger); }

    button {
      font-family: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: var(--card-hover); border-color: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--primary); border-color: var(--primary); }
    button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

    .layout { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }

    .tests { overflow-y: auto; padding: 16px 20px; }
    .events {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .events-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .events-head .count { margin-left: auto; color: var(--text-muted); font-weight: 400; }
    .events-log { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.5; }
    .event-item { padding: 4px 6px; border-bottom: 1px solid rgba(42,53,72,0.5); color: var(--text-muted); word-break: break-all; }
    .event-item .etype { color: var(--primary); font-weight: 600; }

    .group { margin-bottom: 22px; }
    .group-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .row:hover { border-color: var(--primary); }
    .row-main { display: flex; align-items: center; gap: 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .dot.running { background: var(--warn); animation: pulse 0.8s infinite; }
    .dot.ok { background: var(--ok); }
    .dot.fail { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.3; } }

    .row-info { flex: 1; min-width: 0; }
    .row-api { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .row-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
    .badge.unsafe { background: rgba(239,68,68,0.15); color: var(--danger-hover); }
    .badge.side { background: rgba(245,158,11,0.15); color: var(--warn); }

    .row input.arg {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      width: 160px;
    }

    .result {
      margin-top: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .result.show { display: block; }
    .result.ok { border-color: rgba(34,197,94,0.4); }
    .result.fail { border-color: rgba(239,68,68,0.4); color: var(--danger-hover); }

    .banner {
      background: rgba(239,68,68,0.12);
      border: 1px solid var(--danger);
      color: var(--danger-hover);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
    .banner.show { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">&#129514;</span> 接口测试台</h1>
    <span class="summary" id="summary"></span>
    <button id="runAllBtn" class="primary">全部测试（安全项）</button>
    <button id="clearBtn">清空结果</button>
  </div>

  <div class="layout">
    <div class="tests">
      <div class="banner" id="banner"></div>
      <div id="groups"></div>
    </div>
    <div class="events">
      <div class="events-head">
        <span>&#128225; 运行时事件流</span>
        <span class="count" id="eventCount">0</span>
      </div>
      <div class="events-log" id="eventsLog"></div>
    </div>
  </div>

  <script>
    const api = window.mossApp;
    const S = { tmpPath: null, cronId: null };

    // ---- helpers ----
    function truncate(str, n = 2000) {
      if (typeof str !== 'string') return str;
      return str.length > n ? str.slice(0, n) + '\n… (已截断 ' + (str.length - n) + ' 字符)' : str;
    }
    function fmt(v) {
      if (v === undefined) return 'undefined';
      try { return truncate(JSON.stringify(v, null, 2)); } catch { return truncate(String(v)); }
    }

    // ---- test registry ----
    // unsafe: 真正会产生副作用 / 触发 AI / 打开窗口，排除在"全部测试"之外
    const TESTS = [
      // 应用信息与版本
      { group: '应用信息 / 版本', api: 'getAppInfo()', desc: '读取当前 App 元信息', run: () => api.getAppInfo() },
      { group: '应用信息 / 版本', api: 'getMeta()', desc: 'getAppInfo 的别名', run: () => api.getMeta() },
      { group: '应用信息 / 版本', api: 'getVersions()', desc: '历史版本快照列表', run: () => api.getVersions() },
      { group: '应用信息 / 版本', api: 'rollback(versionId)', desc: '回滚版本（会重启 App）', unsafe: true, input: 'versionId',
        run: (v) => { if (!v) throw new Error('请填写 versionId'); return api.rollback(v); } },

      // 本地存储
      { group: '本地存储 storage', api: 'storage.setItem(k,v)', desc: '写入测试键', run: () => api.storage.setItem('__bridge_test__', 'ok-' + Date.now()) },
      { group: '本地存储 storage', api: 'storage.getItem(k)', desc: '读取测试键', run: () => api.storage.getItem('__bridge_test__') },
      { group: '本地存储 storage', api: 'storage.list()', desc: '列出所有键', run: () => api.storage.list() },
      { group: '本地存储 storage', api: 'storage.removeItem(k)', desc: '删除测试键', run: () => api.storage.removeItem('__bridge_test__') },

      // 沙箱文件（相对路径，限定在 App 的 filesDir 内）
      { group: '沙箱文件 fs（相对路径）', api: 'fs.writeText(p,c)', desc: '写 bridge-test.txt', run: () => api.fs.writeText('bridge-test.txt', 'hello ' + Date.now()) },
      { group: '沙箱文件 fs（相对路径）', api: 'fs.readText(p)', desc: '读 bridge-test.txt', run: () => api.fs.readText('bridge-test.txt') },
      { group: '沙箱文件 fs（相对路径）', api: 'fs.list(dir)', desc: '列出沙箱根目录', run: () => api.fs.list('.') },
      { group: '沙箱文件 fs（相对路径）', api: 'fs.mkdir(dir)', desc: '建 bridge-test-dir', run: () => api.fs.mkdir('bridge-test-dir') },
      { group: '沙箱文件 fs（相对路径）', api: 'fs.delete(p)', desc: '删 bridge-test.txt', run: () => api.fs.delete('bridge-test.txt') },

      // 全局文件（绝对路径）
      { group: '全局文件 fs（绝对路径）', api: 'fs.getHomeDir()', desc: '获取用户主目录', run: () => api.fs.getHomeDir() },
      { group: '全局文件 fs（绝对路径）', api: 'fs.listGlobal(dir)', desc: '列出主目录', run: async () => { const h = await api.fs.getHomeDir(); const l = await api.fs.listGlobal(h); return { dir: h, count: l.length, sample: l.slice(0, 5) }; } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.createTempFile(name)', desc: '创建临时文件路径', run: async () => { S.tmpPath = await api.fs.createTempFile('bridge-test.txt'); return S.tmpPath; } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.writeGlobalBinary(p,d)', desc: '写入临时文件', run: async () => { if (!S.tmpPath) S.tmpPath = await api.fs.createTempFile('bridge-test.txt'); const r = await api.fs.writeGlobalBinary(S.tmpPath, 'moss-bridge-test'); return { path: S.tmpPath, ok: r }; } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.readGlobalText(p)', desc: '读回临时文件', run: async () => { if (!S.tmpPath) throw new Error('请先运行 createTempFile / writeGlobalBinary'); return api.fs.readGlobalText(S.tmpPath); } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.getFileMetadata(p)', desc: '临时文件大小等', run: async () => { if (!S.tmpPath) throw new Error('请先创建临时文件'); return api.fs.getFileMetadata(S.tmpPath); } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.getImageBase64(p)', desc: '读文件为 dataURI', run: async () => { if (!S.tmpPath) throw new Error('请先创建临时文件'); const d = await api.fs.getImageBase64(S.tmpPath); return typeof d === 'string' ? d.slice(0, 80) + '…' : d; } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.getAppIcon()', desc: '应用图标 dataURI', run: async () => { const d = await api.fs.getAppIcon(); return typeof d === 'string' ? d.slice(0, 80) + '…' : d; } },
      { group: '全局文件 fs（绝对路径）', api: 'fs.deleteGlobal(p)', desc: '清理临时文件', run: async () => { if (!S.tmpPath) throw new Error('无临时文件'); const r = await api.fs.deleteGlobal(S.tmpPath); S.tmpPath = null; return r; } },

      // AI Agent
      { group: 'AI Agent', api: 'agent.send({prompt})', desc: '发一条 prompt（真实调用 AI）', unsafe: true, run: () => api.agent.send({ prompt: '只回复两个字：pong', stream: false }) },
      { group: 'AI Agent', api: 'agent.cancel(id)', desc: '取消（无进行中请求也应正常返回）', run: () => api.agent.cancel('none-' + Date.now()) },
      { group: 'AI Agent', api: 'agent.reset()', desc: '释放 App agent 运行时', run: () => api.agent.reset() },

      // 定时任务
      { group: '定时任务 cron', api: 'cron.add(item)', desc: '新增测试任务', run: async () => { const r = await api.cron.add({ cron: '0 0 1 1 *', prompt: '__bridge_test__', recurring: false }); S.cronId = r && r.id; return r; } },
      { group: '定时任务 cron', api: 'cron.get(id)', desc: '读取测试任务', run: async () => { if (!S.cronId) throw new Error('请先运行 cron.add'); return api.cron.get(S.cronId); } },
      { group: '定时任务 cron', api: 'cron.update(id,u)', desc: '更新测试任务', run: async () => { if (!S.cronId) throw new Error('请先运行 cron.add'); return api.cron.update(S.cronId, { prompt: '__bridge_test_updated__' }); } },
      { group: '定时任务 cron', api: 'cron.list()', desc: '列出全部任务', run: () => api.cron.list() },
      { group: '定时任务 cron', api: 'cron.delete(id)', desc: '清理测试任务', run: async () => { if (!S.cronId) throw new Error('请先运行 cron.add'); const r = await api.cron.delete(S.cronId); S.cronId = null; return r; } },

      // 系统 shell
      { group: '系统 shell', api: 'shell.openExternal（协议拦截）', desc: '非法协议应被拦截，不打开', run: async () => { const r = await api.shell.openExternal('ftp://blocked.example'); if (r && r.ok === false) return { 已拦截: true, ...r }; throw new Error('未拦截非法协议: ' + fmt(r)); } },
      { group: '系统 shell', api: 'shell.openExternal(url)', desc: '打开 https://example.com', sideEffect: true, run: () => api.shell.openExternal('https://example.com') },
      { group: '系统 shell', api: 'shell.openFile(path)', desc: '用默认程序打开文件', sideEffect: true, input: 'filePath', run: (p) => { const t = p || S.tmpPath; if (!t) throw new Error('请填写路径或先创建临时文件'); return api.shell.openFile(t); } },
      { group: '系统 shell', api: 'shell.showItemInFolder(p)', desc: '在文件管理器定位', sideEffect: true, input: 'filePath', run: (p) => { const t = p || S.tmpPath; if (!t) throw new Error('请填写路径或先创建临时文件'); return api.shell.showItemInFolder(t); } },

      // 文档转换
      { group: '文档转换 document', api: 'document.isLibreOfficeAvailable()', desc: '探测转换能力', run: () => api.document.isLibreOfficeAvailable() },
      { group: '文档转换 document', api: 'document.convert(p,to)', desc: '转 markdown（需 docx 路径）', unsafe: true, input: 'docx 路径', run: (p) => { if (!p) throw new Error('请填写 Word 文件路径'); return api.document.convert(p, 'markdown'); } },

      // 预览
      { group: '预览 preview', api: 'preview.open(data)', desc: '打开预览窗口', sideEffect: true, run: () => api.preview.open({ title: 'Bridge Test', html: '<h1>preview ok</h1>', mime: 'text/html' }) },
      { group: '预览 preview', api: 'preview.close()', desc: '关闭预览', sideEffect: true, run: () => api.preview.close() },

      // 日志
      { group: '日志 log', api: 'log.write(...)', desc: '写入宿主日志', run: () => api.log.write('info', 'bridge-test', 'hello from bridge tester', { ts: Date.now() }) },

      // 通用网关
      { group: '通用网关', api: 'listTools()', desc: '列出运行时工具', run: () => api.listTools() },
      { group: '通用网关', api: 'listResources()', desc: '列出运行时资源', run: () => api.listResources() },
      { group: '通用网关', api: "callTool('versions.list')", desc: '通用工具调用', run: () => api.callTool('versions.list') },
      { group: '通用网关', api: 'readResource(uri)', desc: '读取资源（默认取第一个）', input: 'uri', run: async (uri) => { let u = uri; if (!u) { const res = await api.listResources(); u = res && res[0] && res[0].uri; if (!u) throw new Error('无可用资源，请手动填 uri'); } return api.readResource(u); } },

      // 事件订阅
      { group: '事件订阅 events', api: 'onRuntimeEvent(cb)', desc: '触发 mkdir 并等待 files:changed 事件', run: () => new Promise((resolve, reject) => {
          let done = false;
          const off = api.onRuntimeEvent((ev) => {
            if (!done && ev && ev.type === 'files:changed') { done = true; off(); api.fs.delete('bridge-event-probe-dir').catch(() => {}); resolve({ 收到事件: ev }); }
          });
          api.fs.mkdir('bridge-event-probe-dir').catch((e) => { if (!done) { done = true; off(); reject(e); } });
          setTimeout(() => { if (!done) { done = true; off(); reject(new Error('5s 内未收到 files:changed 事件')); } }, 5000);
        }) },
      { group: '事件订阅 events', api: 'onAgentEvent(cb)', desc: '订阅/退订冒烟', run: () => { const off = api.onAgentEvent(() => {}); off(); return { subscribed: true, unsubscribed: true }; } },
      { group: '事件订阅 events', api: 'onAgentState(cb)', desc: '订阅/退订冒烟', run: () => { const off = api.onAgentState(() => {}); off(); return { subscribed: true, unsubscribed: true }; } },
      { group: '事件订阅 events', api: 'onPermission(cb)', desc: '订阅/退订冒烟', run: () => { const off = api.onPermission(() => {}); off(); return { subscribed: true, unsubscribed: true }; } },
    ];

    TESTS.forEach((t, i) => { t.id = 'test-' + i; });

    // ---- render ----
    const groupsEl = document.getElementById('groups');
    const summaryEl = document.getElementById('summary');
    const stats = {};

    function renderGroups() {
      const byGroup = {};
      TESTS.forEach(t => { (byGroup[t.group] = byGroup[t.group] || []).push(t); });
      groupsEl.innerHTML = Object.entries(byGroup).map(([group, tests]) => `
        <div class="group">
          <div class="group-title">${group}</div>
          ${tests.map(t => `
            <div class="row" id="${t.id}">
              <div class="row-main">
                <span class="dot" id="${t.id}-dot"></span>
                <div class="row-info">
                  <div class="row-api">${t.api}</div>
                  <div class="row-desc">${t.desc}</div>
                </div>
                ${t.input ? `<input class="arg" id="${t.id}-arg" placeholder="${t.input}">` : ''}
                ${t.unsafe ? '<span class="badge unsafe">副作用</span>' : ''}
                ${t.sideEffect ? '<span class="badge side">会弹窗</span>' : ''}
                <button data-run="${t.id}">测试</button>
              </div>
              <div class="result" id="${t.id}-result"></div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function setStatus(t, state, payload) {
      const dot = document.getElementById(t.id + '-dot');
      const res = document.getElementById(t.id + '-result');
      dot.className = 'dot ' + (state === 'running' ? 'running' : state === 'ok' ? 'ok' : state === 'fail' ? 'fail' : '');
      if (state === 'ok' || state === 'fail') {
        res.className = 'result show ' + state;
        res.textContent = (state === 'ok' ? '✓ ' : '✗ ') + payload;
        stats[t.id] = state;
      } else if (state === 'running') {
        res.className = 'result show';
        res.textContent = '运行中…';
      }
      updateSummary();
    }

    function updateSummary() {
      const vals = Object.values(stats);
      const ok = vals.filter(v => v === 'ok').length;
      const fail = vals.filter(v => v === 'fail').length;
      summaryEl.innerHTML = vals.length ? `已测 ${vals.length} · <b class="ok">通过 ${ok}</b> · <b class="fail">失败 ${fail}</b>` : '';
    }

    async function runTest(t) {
      if (!api) { setStatus(t, 'fail', 'window.mossApp 不可用（当前非宿主运行时）'); return false; }
      setStatus(t, 'running');
      const arg = t.input ? (document.getElementById(t.id + '-arg')?.value || '').trim() : undefined;
      try {
        const out = await t.run(arg);
        setStatus(t, 'ok', fmt(out));
        return true;
      } catch (err) {
        setStatus(t, 'fail', (err && err.message) || String(err));
        return false;
      }
    }

    async function runAll() {
      const btn = document.getElementById('runAllBtn');
      btn.disabled = true;
      const safe = TESTS.filter(t => !t.unsafe && !t.sideEffect);
      for (const t of safe) { await runTest(t); }
      btn.disabled = false;
    }

    // ---- event stream panel ----
    let eventN = 0;
    const eventsLog = document.getElementById('eventsLog');
    const eventCount = document.getElementById('eventCount');
    function pushEvent(ev) {
      eventN++;
      eventCount.textContent = eventN;
      const item = document.createElement('div');
      item.className = 'event-item';
      const type = (ev && ev.type) || 'event';
      item.innerHTML = `<span class="etype">${type}</span> <span>${new Date().toLocaleTimeString()}</span>`;
      eventsLog.prepend(item);
      while (eventsLog.children.length > 100) eventsLog.removeChild(eventsLog.lastChild);
    }

    // ---- wire up ----
    renderGroups();

    if (!api) {
      const b = document.getElementById('banner');
      b.className = 'banner show';
      b.textContent = '⚠ 未检测到 window.mossApp —— 当前不在 Moss 宿主运行时中，所有测试将失败。请在 Moss 里作为 App 打开本页。';
    } else {
      if (typeof api.onRuntimeEvent === 'function') api.onRuntimeEvent(pushEvent);
    }

    document.getElementById('groups').addEventListener('click', (e) => {
      const id = e.target.getAttribute && e.target.getAttribute('data-run');
      if (!id) return;
      const t = TESTS.find(x => x.id === id);
      if (t) runTest(t);
    });
    document.getElementById('runAllBtn').addEventListener('click', runAll);
    document.getElementById('clearBtn').addEventListener('click', () => {
      TESTS.forEach(t => {
        document.getElementById(t.id + '-dot').className = 'dot';
        const r = document.getElementById(t.id + '-result');
        r.className = 'result'; r.textContent = '';
      });
      for (const k in stats) delete stats[k];
      updateSummary();
    });
  </script>
</body>
</html>
