#buddy-companion-preview .b-settings summary::-webkit-details-marker{display:none}
#buddy-companion-preview .b-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
#buddy-companion-preview .b-setting{display:grid;gap:6px;min-width:0;font-size:12px}
#buddy-companion-preview .b-setting select{padding:8px;border:1px solid var(--b-line);border-radius:9px;background:var(--b-ground);width:100%;min-width:0}

#buddy-companion-preview .b-happy .b-eye{height:6px;border-radius:8px 8px 0 0}

@keyframes buddy-greeting{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-12px) rotate(-7deg)}65%{transform:translateY(-3px) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){#buddy-companion-preview .b-creature{animation:none!important}}
@media(max-width:460px){#buddy-companion-preview .buddy-product{margin:8px 0;border-radius:20px}#buddy-companion-preview .b-main{padding:18px}#buddy-companion-preview .b-pet-header{gap:12px;padding:0 0 10px}#buddy-companion-preview .b-art{width:118px;flex-basis:118px}#buddy-companion-preview .b-settings-grid{grid-template-columns:1fr}#buddy-companion-preview .b-top{padding-left:18px}#buddy-companion-preview .b-name-row{gap:8px}#buddy-companion-preview .b-field{font-size:16px}}
@media(pointer:coarse){#buddy-companion-preview .b-chip,#buddy-companion-preview .b-settings summary,#buddy-companion-preview .b-setting-check{min-height:44px}#buddy-companion-preview .b-send{height:44px;width:44px}}
</style>
<div id="buddy-companion-preview" class="viz-carousel viz-dotted-background" aria-label="Buddy 宠物形象与孵化聊天预览" data-previous-label="上一种形象" data-next-label="下一种形象">
  <section data-variant="小苔团" aria-label="小苔团形象">
    <div class="buddy-product" data-skin="moss" aria-label="Buddy 孵化与聊天">
      <header class="b-top"><span class="b-mark"><i data-lucide="sprout" aria-hidden="true"></i></span><strong>Buddy</strong><span class="b-preview-label">交互预览 · 对话为示例</span></header>
      <div class="b-main">
        <div class="b-unhatched">
          <div class="b-intro"><h3>认识你的新伙伴</h3><p>孵化后，就可以和它聊天了。</p></div>
          <div class="b-stage" role="img" aria-label="一颗带小叶子的奶白色宠物蛋"><div class="b-egg"></div></div>
          <div class="b-name-row"><label>取个名字 <input class="b-field b-pet-name" value="小苔" maxlength="16" aria-label="宠物名字"></label></div>
          <button class="b-primary b-hatch cursor-interaction" type="button"><i data-lucide="sparkles" aria-hidden="true"></i>孵化我的伙伴</button>
          <p class="b-under">自带 Buddy 助手，随时聊日常、问用法、调配置。</p>
        </div>
        <div class="b-hatched">
          <div class="b-pet-header"><div class="b-art" role="img" aria-label="小苔团宠物"><div class="b-creature"><div class="b-face"><span class="b-eye"></span><span class="b-eye"></span><span class="b-mouth"></span><span class="b-cheeks"></span></div></div></div><div><h3 class="b-display-name">小苔</h3><div class="b-status">在这儿，陪你一起。</div></div></div>
          <div class="b-chat" role="log" aria-live="polite" aria-label="与宠物的示例对话"></div>
          <div class="b-shortcuts"><button class="b-chip cursor-interaction" type="button" data-prompt="今天有点累">聊聊今天</button><button class="b-chip cursor-interaction" type="button" data-prompt="你能帮我怎么使用 Moss？">问问 Moss</button><button class="b-chip cursor-interaction" type="button" data-prompt="我想调整 Moss 的配置">调一下配置</button></div>
          <form class="b-composer"><input class="b-field b-chat-input" aria-label="给宠物发消息" placeholder="跟小苔说点什么…" maxlength="240" required><button class="b-primary b-send cursor-interaction" type="submit" aria-label="发送示例消息"><i data-lucide="arrow-up" aria-hidden="true"></i></button></form>
          <details class="b-settings"><summary class="cursor-interaction"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>伙伴设置</summary><div class="b-settings-grid"><label class="b-setting">回应我的助手<select class="b-responder"><option value="builtin">Buddy 内置助手</option><option value="research">研究助手（示例）</option></select></label><label class="b-setting">聊天口吻<select class="b-tone"><option value="warm">温和自然</option><option value="playful">活泼一点</option><option value="concise">简洁直接</option></select></label></div><label class="b-setting-check"><input type="checkbox" class="b-config-enabled" checked>允许通过对话修改 Moss 配置</label><p class="b-setting-note">模型跟随 Moss 默认设置。它记得你们的聊天；更换外形也不会忘记。</p></details>
        </div>
      </div>
    </div>
  </section>
  <section data-variant="圆润机器人" aria-label="圆润机器人形象" hidden></section>
  <section data-variant="极简光球" aria-label="极简光球形象" hidden></section>
</div>
<script>
(() => {
  const root = document.getElementById('buddy-companion-preview');
  const original = root.querySelector('.buddy-product');
  const variants = Array.from(root.querySelectorAll(':scope > section'));
  ['robot', 'orb'].forEach((skin, i) => {
    const copy = original.cloneNode(true);
    copy.dataset.skin = skin;
    copy.querySelector('.b-art').setAttribute('aria-label', i ? '极简光球宠物' : '圆润机器人宠物');
    variants[i + 1].append(copy);
  });
  const products = Array.from(root.querySelectorAll('.buddy-product'));
  const state = { version: 1, hatched: false, name: '小苔', responder: 'builtin', tone: 'warm', configEnabled: true, messages: [] };
  function restore(snapshot) {
    const s = snapshot?.privateContent;
    if (!s || s.version !== 1) return;
    state.hatched = s.hatched === true;
    state.name = typeof s.name === 'string' && s.name.trim() ? s.name.trim().slice(0, 16) : '小苔';
    state.responder = s.responder === 'research' ? 'research' : 'builtin';
    state.tone = ['warm', 'playful', 'concise'].includes(s.tone) ? s.tone : 'warm';
    state.configEnabled = s.configEnabled !== false;
    state.messages = Array.isArray(s.messages) ? s.messages.filter(m => m && ['user', 'pet'].includes(m.role) && typeof m.text === 'string').slice(-4).map(m => ({role: m.role, text: m.text.slice(0, 360)})) : [];
  }
  function persist() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { petName: state.name, hatched: state.hatched, responder: state.responder, tone: state.tone }, privateContent: { ...state } }).catch(() => {});
  }
  function paint() {
    products.forEach(product => {
      product.classList.toggle('hatched', state.hatched);
      product.querySelector('.b-display-name').textContent = state.name;
      product.querySelector('.b-pet-name').value = state.name;
      product.querySelector('.b-chat-input').placeholder = `跟${state.name}说点什么…`;
      product.querySelector('.b-responder').value = state.responder;
      product.querySelector('.b-tone').value = state.tone;
      product.querySelector('.b-config-enabled').checked = state.configEnabled;
      const log = product.querySelector('.b-chat');
      log.replaceChildren();
      state.messages.forEach(message => {
        const el = document.createElement('div');
        el.className = `b-message ${message.role}`;
        el.textContent = message.text;
        log.append(el);
      });
    });
  }
  function greetAnimation(product) {
    product.classList.remove('b-jump');
    void product.offsetWidth;
    product.classList.add('b-jump');
  }
  function reply(text) {
    if (/配置|设置|模型|主题|参数/.test(text)) return state.configEnabled ? '桌面设置、Agent 参数、项目配置，都可以来找我。比如“切换深色模式”，或者“只给这个项目换个模型”。' : '可以先一起看看配置的含义和当前值。你已关闭对话修改，确认要调整时，可以在伙伴设置中开启。';
    if (/累|烦|难过/.test(text)) return state.tone === 'concise' ? '先歇一会儿吧。想聊聊发生了什么，我在。' : `辛苦啦。先把手头的事放一放，喝口水。我在这儿，你想说什么都可以。`;
    if (/Moss|moss|用法|能做/.test(text)) return '你可以和我聊日常，也可以问 Moss 怎么用、调桌面和 Agent 配置，或者让我在重要任务结束时提醒你。';
    return state.tone === 'playful' ? '收到！我竖起小耳朵了，接着说吧。' : state.tone === 'concise' ? '我在。说说你想聊的事吧。' : '我在听呢。无论是今天的小事，还是想一起解决的问题，都可以慢慢说。';
  }
  function send(product, text) {
    const cleaned = text.trim().slice(0, 240);
    if (!cleaned) return;
    state.messages = [...state.messages, { role: 'user', text: cleaned }, { role: 'pet', text: reply(cleaned) }].slice(-4);
    products.forEach(p => { p.querySelector('.b-chat-input').value = ''; });
    paint(); persist(); greetAnimation(product);
  }
  restore(window.openai?.widgetState);
  if (state.hatched && !state.messages.length) state.messages.push({role: 'pet', text: `你好呀，我是${state.name}。很高兴认识你！今天想聊点什么？`});
  products.forEach(product => {
    product.querySelector('.b-hatch').addEventListener('click', () => {
      state.name = product.querySelector('.b-pet-name').value.trim().slice(0, 16) || '小苔';
      state.hatched = true;
      state.messages = [{role: 'pet', text: `你好呀，我是${state.name}，以后就陪着你啦。可以跟我聊聊今天，也可以问 Moss 怎么用。`}];
      paint(); persist(); greetAnimation(product);
      product.querySelector('.b-chat-input').focus();
    });
    product.querySelector('.b-composer').addEventListener('submit', event => { event.preventDefault(); send(product, product.querySelector('.b-chat-input').value); });
    product.querySelectorAll('[data-prompt]').forEach(button => button.addEventListener('click', () => send(product, button.dataset.prompt)));
    product.querySelector('.b-responder').addEventListener('change', event => { state.responder = event.target.value; paint(); persist(); });
    product.querySelector('.b-tone').addEventListener('change', event => { state.tone = event.target.value; paint(); persist(); });
    product.querySelector('.b-config-enabled').addEventListener('change', event => { state.configEnabled = event.target.checked; paint(); persist(); });
    if (globalThis.Tweak) {
      const visual = { activity: '陪伴' };
      const tweak = new Tweak({container: product, onChange: () => {
        product.classList.toggle('b-thinking', visual.activity === '思考');
        product.classList.toggle('b-happy', visual.activity === '有好消息');
        product.classList.toggle('b-quiet', visual.activity === '安静陪伴');
        product.querySelector('.b-status').textContent = ({'陪伴':'在这儿，陪你一起。','思考':'让我想一想…','有好消息':'有个好消息想告诉你。','安静陪伴':'安静地陪着你。'})[visual.activity];
      }});
      tweak.addSelect(visual, 'activity', {label: '宠物状态', options: ['陪伴','思考','有好消息','安静陪伴']});
    }
  });
  paint();
  if (globalThis.lucide) lucide.createIcons({attrs: {width:16,height:16}});
  window.addEventListener('openai:set_globals', event => { if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); paint(); } });
})();
</script>
