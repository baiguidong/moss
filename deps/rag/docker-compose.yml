name: ${COMPOSE_PROJECT_NAME:-ragflow}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.40}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=1073741824
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/init.sql:/docker-entrypoint-initdb.d/01-ragflow.sql:ro
    networks: [ragflow]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 60
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-08-06T00-00-00Z}
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [ragflow]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
    mem_limit: ${MINIO_MEM_LIMIT:-768m}
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-valkey/valkey:8}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    networks: [ragflow]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 60
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    restart: unless-stopped

  infinity:
    image: ${INFINITY_IMAGE:-infiniflow/infinity:v0.7.3-x64-v3}
    command: ["-f", "/infinity_conf.toml"]
    volumes:
      - infinity_data:/var/infinity
      - ./config/infinity_conf.toml:/infinity_conf.toml:ro
    networks: [ragflow]
    healthcheck:
      test: ["CMD", "curl", "http://127.0.0.1:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 60
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    mem_limit: ${INFINITY_MEM_LIMIT:-4g}
    restart: unless-stopped

  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.27.1}
    env_file: ${RAGFLOW_ENV_FILE:-.env}
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --workers=1
    environment:
      DEVICE: ${RAGFLOW_DEVICE:-cpu}
      DOC_ENGINE: infinity
      DB_TYPE: mysql
      DEFAULT_SUPERUSER_EMAIL: ${RAGFLOW_ADMIN_EMAIL:-admin@ragflow.io}
      DEFAULT_SUPERUSER_NICKNAME: ${RAGFLOW_ADMIN_NICKNAME:-admin}
      DEFAULT_SUPERUSER_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      MYSQL_HOST: mysql
      MINIO_HOST: minio
      REDIS_HOST: redis
      INFINITY_HOST: infinity
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      infinity:
        condition: service_healthy
    ports:
      - "${RAGFLOW_BIND_IP:-0.0.0.0}:${SVR_WEB_HTTP_PORT:-80}:80"
      - "${RAGFLOW_ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_SVR_HTTP_PORT:-9381}:9381"
    volumes:
      - ragflow_logs:/ragflow/logs
    networks: [ragflow]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9380/api/v1/system/healthz"]
      interval: 15s
      timeout: 8s
      retries: 80
      start_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    mem_limit: ${RAGFLOW_MEM_LIMIT:-4g}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  ragflow-mcp-extended:
    profiles: [extended-mcp]
    image: ${EXTENDED_MCP_IMAGE:-moss/ragflow-mcp-extended:0.1.0}
    build:
      context: ./mcp-extended
      args:
        PYTHON_BASE_IMAGE: ${EXTENDED_MCP_PYTHON_IMAGE:-python:3.12-slim-bookworm}
    environment:
      RAGFLOW_BASE_URL: http://ragflow:9380
      EXTENDED_MCP_HOST: 0.0.0.0
      EXTENDED_MCP_PORT: 9385
      EXTENDED_MCP_PUBLIC_URL: ${EXTENDED_MCP_PUBLIC_URL}
      EXTENDED_MCP_SCOPES: ${EXTENDED_MCP_SCOPES:-read,write,agent}
      EXTENDED_MCP_MAX_BASE64_MB: ${EXTENDED_MCP_MAX_BASE64_MB:-8}
      EXTENDED_MCP_MAX_UPLOAD_MB: ${EXTENDED_MCP_MAX_UPLOAD_MB:-200}
    depends_on:
      ragflow:
        condition: service_healthy
    ports:
      - "${RAGFLOW_MCP_BIND_IP:-127.0.0.1}:${EXTENDED_MCP_PORT:-9385}:9385"
    networks: [ragflow]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    restart: unless-stopped

  moss-rag-mcp:
    profiles: [moss-rag-mcp]
    image: ${EXTENDED_MCP_IMAGE:-moss/ragflow-mcp-extended:0.1.0}
    build:
      context: ./mcp-extended
      args:
        PYTHON_BASE_IMAGE: ${EXTENDED_MCP_PYTHON_IMAGE:-python:3.12-slim-bookworm}
    environment:
      RAGFLOW_BASE_URL: http://ragflow:9380
      EXTENDED_MCP_HOST: 0.0.0.0
      EXTENDED_MCP_PORT: 9386
      EXTENDED_MCP_PUBLIC_URL: ${MOSS_RAG_MCP_PUBLIC_URL}
      EXTENDED_MCP_MAX_BASE64_MB: ${EXTENDED_MCP_MAX_BASE64_MB:-8}
      EXTENDED_MCP_MAX_UPLOAD_MB: ${EXTENDED_MCP_MAX_UPLOAD_MB:-200}
      MCP_AUTH_MODE: moss
      MCP_SERVICE_NAME: moss-rag-mcp
      MOSS_SERVER_URL: ${MOSS_RAG_MCP_MOSS_SERVER_URL}
      MOSS_RAGFLOW_GATEWAY_TOKEN: ${MOSS_RAGFLOW_GATEWAY_TOKEN}
    depends_on:
      ragflow:
        condition: service_healthy
    ports:
      - "${RAGFLOW_MCP_BIND_IP:-127.0.0.1}:${MOSS_RAG_MCP_PORT:-9386}:9386"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [ragflow]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9386/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    restart: unless-stopped

  ollama:
    profiles: [local-models]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.3}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    networks: [ragflow]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 60
    mem_limit: 3g
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  redis_data:
  infinity_data:
  ragflow_logs:
  ollama_data:

networks:
  ragflow:
    driver: bridge
