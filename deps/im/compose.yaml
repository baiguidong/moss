name: openim

networks:
  openim:
    driver: bridge
  moss-integration:
    name: ${MOSS_INTEGRATION_NETWORK:-moss-integrations}
    external: true

services:
  mongo:
    image: ${MONGO_IMAGE}
    container_name: mongo
    command: >
      bash -c '
      docker-entrypoint.sh mongod --wiredTigerCacheSizeGB 1 --auth &
      until mongosh -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 1; done;
      mongosh -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "
      db = db.getSiblingDB(\"$${MONGO_INITDB_DATABASE}\");
      if (!db.getUser(\"$${MONGO_OPENIM_USERNAME}\")) {
        db.createUser({user: \"$${MONGO_OPENIM_USERNAME}\", pwd: \"$${MONGO_OPENIM_PASSWORD}\", roles: [{role: \"readWrite\", db: \"$${MONGO_INITDB_DATABASE}\"}]});
      }
      ";
      wait
      '
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: openim_v3
      MONGO_OPENIM_USERNAME: ${MONGO_USERNAME}
      MONGO_OPENIM_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ${DATA_DIR}/components/mongodb/data/db:/data/db
      - ${DATA_DIR}/components/mongodb/data/logs:/data/logs
      - ${DATA_DIR}/components/mongodb/data/conf:/etc/mongo
    healthcheck:
      test: [CMD-SHELL, 'mongosh -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --quiet --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [openim]

  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --aof-use-rdb-preamble
      - "yes"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${DATA_DIR}/components/redis/data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [openim]

  etcd:
    image: ${ETCD_IMAGE}
    container_name: etcd
    environment:
      ETCD_NAME: s1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: s1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: openim
      ETCD_INITIAL_CLUSTER_STATE: new
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - ${DATA_DIR}/components/etcd:/etcd-data
    healthcheck:
      test: [CMD-SHELL, 'etcdctl --endpoints=http://127.0.0.1:2379 endpoint health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [openim]

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    user: root
    environment:
      TZ: Asia/Shanghai
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - ${DATA_DIR}/components/kafka:/bitnami/kafka
    healthcheck:
      test: [CMD-SHELL, '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [openim]

  minio:
    image: ${MINIO_IMAGE}
    container_name: minio
    command: server /data --console-address :9090
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
    ports:
      - ${OPENIM_BIND_IP}:${MINIO_PORT}:9000
      - ${OPENIM_ADMIN_BIND_IP}:${MINIO_CONSOLE_PORT}:9090
    volumes:
      - ${DATA_DIR}/components/mnt/data:/data
      - ${DATA_DIR}/components/mnt/config:/root/.minio
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [openim]

  openim-server:
    image: ${OPENIM_SERVER_IMAGE}
    container_name: openim-server
    init: true
    environment:
      IMENV_MONGODB_ADDRESS: ${MONGO_ADDRESS}
      IMENV_MONGODB_USERNAME: ${MONGO_USERNAME}
      IMENV_MONGODB_PASSWORD: ${MONGO_PASSWORD}
      IMENV_KAFKA_ADDRESS: ${KAFKA_ADDRESS}
      IMENV_KAFKA_USERNAME: ${KAFKA_USERNAME}
      IMENV_KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      IMENV_DISCOVERY_ETCD_ADDRESS: ${ETCD_ADDRESS}
      IMENV_DISCOVERY_ETCD_USERNAME: ${ETCD_USERNAME}
      IMENV_DISCOVERY_ETCD_PASSWORD: ${ETCD_PASSWORD}
      IMENV_REDIS_ADDRESS: ${REDIS_ADDRESS}
      IMENV_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IMENV_MINIO_INTERNALADDRESS: ${MINIO_INTERNAL_ADDRESS}
      IMENV_MINIO_EXTERNALADDRESS: ${MINIO_EXTERNAL_ADDRESS}
      IMENV_MINIO_ACCESSKEYID: ${MINIO_ACCESS_KEY_ID}
      IMENV_MINIO_SECRETACCESSKEY: ${MINIO_SECRET_ACCESS_KEY}
      IMENV_SHARE_SECRET: ${OPENIM_SECRET}
      IMENV_LOG_ISSTDOUT: ${LOG_IS_STDOUT}
      IMENV_LOG_REMAINLOGLEVEL: ${LOG_LEVEL}
      IMENV_OPENIM_API_PROMETHEUS_GRAFANAURL: ${GRAFANA_URL}
    ports:
      - ${OPENIM_BIND_IP}:${OPENIM_MSG_GATEWAY_PORT}:10001
      - ${OPENIM_BIND_IP}:${OPENIM_API_PORT}:10002
    volumes:
      - ./config/webhooks.yml:/openim-server/config/webhooks.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD-SHELL, "nc -z -w 5 127.0.0.1 10001 && nc -z -w 5 127.0.0.1 10002"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [openim, moss-integration]

  openim-chat:
    image: ${OPENIM_CHAT_IMAGE}
    container_name: openim-chat
    init: true
    environment:
      CHATENV_MONGODB_ADDRESS: ${MONGO_ADDRESS}
      CHATENV_MONGODB_USERNAME: ${MONGO_USERNAME}
      CHATENV_MONGODB_PASSWORD: ${MONGO_PASSWORD}
      CHATENV_DISCOVERY_ETCD_ADDRESS: ${ETCD_ADDRESS}
      CHATENV_DISCOVERY_ETCD_USERNAME: ${ETCD_USERNAME}
      CHATENV_DISCOVERY_ETCD_PASSWORD: ${ETCD_PASSWORD}
      CHATENV_REDIS_ADDRESS: ${REDIS_ADDRESS}
      CHATENV_REDIS_PASSWORD: ${REDIS_PASSWORD}
      CHATENV_SHARE_OPENIM_SECRET: ${OPENIM_SECRET}
      CHATENV_SHARE_OPENIM_APIURL: ${API_URL}
      CHATENV_LOG_ISSTDOUT: ${LOG_IS_STDOUT}
      CHATENV_LOG_REMAINLOGLEVEL: ${LOG_LEVEL}
    ports:
      - ${OPENIM_ADMIN_BIND_IP}:${CHAT_API_PORT}:10008
      - ${OPENIM_ADMIN_BIND_IP}:${ADMIN_API_PORT}:10009
    healthcheck:
      test: [CMD-SHELL, "nc -z -w 5 127.0.0.1 10008 && nc -z -w 5 127.0.0.1 10009"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      openim-server: { condition: service_healthy }
    restart: unless-stopped
    networks: [openim]

  openim-web-front:
    image: ${OPENIM_WEB_FRONT_IMAGE}
    container_name: openim-web-front
    ports:
      - ${OPENIM_ADMIN_BIND_IP}:${OPENIM_WEB_FRONT_PORT}:80
    restart: unless-stopped
    networks: [openim]

  openim-admin-front:
    image: ${OPENIM_ADMIN_FRONT_IMAGE}
    container_name: openim-admin-front
    ports:
      - ${OPENIM_ADMIN_BIND_IP}:${OPENIM_ADMIN_FRONT_PORT}:80
    restart: unless-stopped
    networks: [openim]
