version: '3.8'

services:
  moss-server:
    image: my-moss-server:${MOSS_IMAGE_TAG:-v1}
    container_name: moss-server
    restart: always
    ports:
      - "${MOSS_PORT:-43127}:43127"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.moss:/root/.moss
      - ./data:/app/data
      - ./server.json:/app/server.json:ro
    # 允许 Node.js 创建工作线程
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    environment:
      - MOSS_SERVER_CONFIG=/app/server.json 
      - MOSS_HOME=/root/.moss
      - MOSS_HOST_PATH_MAP={"/data/moss/data":"/app/data","/data/moss/.moss":"/root/.moss"}
    networks:
      - moss-network

networks:
  moss-network:
    name: moss-network