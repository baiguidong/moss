model_list:
  - model_name: moss-default
    litellm_params:
      model: os.environ/UPSTREAM_LITELLM_MODEL
      api_key: os.environ/UPSTREAM_API_KEY
      api_base: os.environ/UPSTREAM_API_BASE
  - model_name: moss-fast
    litellm_params:
      model: os.environ/UPSTREAM_LITELLM_MODEL
      api_key: os.environ/UPSTREAM_API_KEY
      api_base: os.environ/UPSTREAM_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  default_key_generate_params:
    max_budget: 10
    budget_duration: 30d
    rpm_limit: 60
    tpm_limit: 100000

litellm_settings:
  set_verbose: false
  drop_params: true
