events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # New API public gateway. The prefix is stripped so clients use the same
    # OpenAI/Anthropic-compatible paths exposed by New API at its root.
    location = /router { return 308 /router/; }
    location ^~ /router/ {
      proxy_pass http://new-api:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/cloud-storage/ {
      proxy_pass http://server:43127;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      client_max_body_size 5g;
      client_body_timeout 120s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 900s;
    }

    location /s/ {
      proxy_pass http://server:43127;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      # Share tokens are credentials; do not put them in the access log.
      access_log off;
      client_max_body_size 16k;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 900s;
    }

    location ~ ^/(admin(?:/|$)|api/v1(?:/|$)|healthz$|readyz$) {
      proxy_pass http://server:43127;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
    location /ws/sessions/ { return 410; }
    location / {
      proxy_pass http://web-gateway:43128;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  server {
    listen 8444 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # Legacy entry redirects to the canonical HTTPS origin.
    location / { return 308 https://$host$request_uri; }
  }
}
