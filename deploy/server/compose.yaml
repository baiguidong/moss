# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker compose up -d
#   2. Access at http://localhost:3000 (or through Moss HTTPS /router)
#
# Using the Moss Server MySQL instead of PostgreSQL:
#   The shared mysql service below owns the Moss database. The
#   new-api-database-init service creates the separate `new-api` database in
#   that same MySQL instance before New API starts.
#
# ⚠️ IMPORTANT: Change all default passwords before deploying to production!

name: ${COMPOSE_PROJECT_NAME}

networks:
  moss-db:
    internal: true
  moss-storage:
    internal: true
  moss-server:
    driver: bridge
  moss-integration:
    name: ${MOSS_INTEGRATION_NETWORK}
    external: true

services:
  web-gateway:
    image: ${MOSS_WEB_IMAGE:-ghcr.io/baiguidong/moss-webui:latest}
    depends_on:
      server: { condition: service_healthy }
    user: "0:0"
    entrypoint: [node, /opt/moss/cloud/gateway.mjs]
    environment:
      MOSS_WEB_AUTH_SERVER: http://server:43127
      MOSS_WEB_IMAGE: ${MOSS_WEB_IMAGE:-ghcr.io/baiguidong/moss-webui:latest}
      MOSS_WEB_ORIGIN: ${MOSS_WEB_ORIGIN:-}
      MOSS_OIDC_WEB_CLIENT_ID: ${MOSS_OIDC_WEB_CLIENT_ID:-moss-web}
      MOSS_OIDC_WEB_CLIENT_SECRET: ${MOSS_OIDC_WEB_CLIENT_SECRET:-}
      MOSS_CLOUD_STATE: /state
      MOSS_CLOUD_SNAPSHOTS: /snapshots
      MOSS_CLOUD_MAX_USERS: ${MOSS_CLOUD_MAX_USERS:-20}
      MOSS_CLOUD_CPUS: ${MOSS_CLOUD_CPUS:-1}
      MOSS_CLOUD_MEMORY_MB: ${MOSS_CLOUD_MEMORY_MB:-1024}
      MOSS_CLOUD_PIDS: ${MOSS_CLOUD_PIDS:-512}
      MOSS_CLOUD_STARTUP_TIMEOUT_SECONDS: ${MOSS_CLOUD_STARTUP_TIMEOUT_SECONDS:-300}
    volumes:
      - moss-cloud-state:/state
      - moss-cloud-snapshots:/snapshots
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    mem_limit: 256m
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [moss-server]

  mysql:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: ${MOSS_DB_NAME}
      MYSQL_USER: ${MOSS_DB_USER}
      MYSQL_PASSWORD: ${MOSS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MOSS_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${MOSS_SERVER_HOME}/var/lib/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [moss-db]

  # New API is the model gateway. It owns channel routing, token accounting,
  # user quota and billing; Moss Server only authenticates Moss users and
  # provisions their New API accounts/tokens.
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ${MOSS_SERVER_HOME}/new-api/data:/data
      - ${MOSS_SERVER_HOME}/new-api/logs:/app/logs
    environment:
      # The New API database is created by new-api-database-init below.
      - SQL_DSN=root:${MOSS_DB_ROOT_PASSWORD}@tcp(mysql:3306)/new-api # Point to the shared Moss MySQL service.
      # - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
      # - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
      # - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:${NEW_API_REDIS_PASSWORD:-123456}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch updates)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used to identify the node in audit logs; recommended for multi-node/container deployments)
      # - DEFAULT_LANGUAGE=zh-CN  # 默认语言：日志输出，以及对方没有指定语言时返回的提示、邮件和通知；可选 en、zh-CN、zh-TW，不设置为 en (Default language for logs and when no language is specified: en, zh-CN, zh-TW; en if unset)
      # - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 (Streaming timeout in seconds, default 120s)
      # - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP client idle connection timeout in seconds, defaults to Go standard library; set 0 to disable
      # - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ (For multi-node deployments, set this to a random string)
      # - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: disabled for local HTTP)
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin (Required exact HTTPS origins when SESSION_COOKIE_SECURE=true)
      # - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式 (Explicit proxy ranges; unset trusts private ranges)
      # - USER_SESSION_ACTIVE_LIMIT=50
      # - USER_SESSION_ISSUANCE_LIMIT=100
      # - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (Must not exceed revoked retention)
      # - USER_SESSION_REVOKED_RETENTION_DAYS=7
      # - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (Alert only; never globally rejects login)
      # - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
      # - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics measurement ID
      # - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami website ID
      # - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami script URL
    depends_on:
      new-api-database-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks:
      - moss-db
      - moss-server
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost:3000/api/status | grep -q ''"success"[[:space:]]*:[[:space:]]*true'' || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  new-api-oidc-init:
    image: ${MOSS_SERVER_IMAGE}
    restart: "no"
    depends_on:
      new-api: { condition: service_healthy }
      server: { condition: service_healthy }
    entrypoint: [/bin/sh, /opt/moss/deploy/server/scripts/new-api-oidc-init.sh]
    environment:
      NEW_API_INTERNAL_URL: http://new-api:3000
      NEW_API_ADMIN_USERNAME: ${NEW_API_ADMIN_USERNAME:-admin}
      NEW_API_ADMIN_PASSWORD: ${NEW_API_ADMIN_PASSWORD:-}
      MOSS_PUBLIC_URL: ${MOSS_WEB_ORIGIN:-}
      MOSS_NEW_API_PUBLIC_BASE_URL: ${MOSS_NEW_API_PUBLIC_BASE_URL:-http://${MOSS_PUBLIC_HOST:-localhost}:3000}
      MOSS_OIDC_NEW_API_CLIENT_ID: ${MOSS_OIDC_NEW_API_CLIENT_ID:-new-api}
      MOSS_OIDC_NEW_API_CLIENT_SECRET: ${MOSS_OIDC_NEW_API_CLIENT_SECRET:-}
    volumes:
      - ./scripts/new-api-oidc-init.sh:/opt/moss/deploy/server/scripts/new-api-oidc-init.sh:ro
    networks: [moss-server]

  new-api-database-init:
    image: ${MYSQL_IMAGE}
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_ROOT_PASSWORD: ${MOSS_DB_ROOT_PASSWORD}
    command:
      - sh
      - -c
      - >-
        mysql --protocol=TCP --host=mysql --user=root --password="$${MYSQL_ROOT_PASSWORD}"
        --execute="CREATE DATABASE IF NOT EXISTS \`new-api\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    networks: [moss-db]

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${NEW_API_REDIS_PASSWORD:-123456}"]
    networks: [moss-server]

  # The upstream compose keeps PostgreSQL as an alternative. Moss uses the
  # shared MySQL service above, so PostgreSQL remains intentionally disabled.
  # postgres:
  #   image: postgres:15
  #   container_name: postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: root
  #     POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
  #     POSTGRES_DB: new-api
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   networks:
  #     - moss-server
  #   # ports:
  #   #   - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

  # The upstream compose also supports ClickHouse for log storage. It stays
  # disabled unless LOG_SQL_DSN and the service are explicitly enabled.
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.8
  #   container_name: clickhouse
  #   restart: always
  #   environment:
  #     CLICKHOUSE_DB: new_api_logs
  #     CLICKHOUSE_USER: default
  #     CLICKHOUSE_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
  #     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #   networks:
  #     - moss-server
  #   # ports:
  #   #   - "8123:8123"  # HTTP interface, uncomment if you need external access
  #   #   - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above

  silo:
    image: ${MINIO_IMAGE}
    profiles: [cloud]
    command: server /data --console-address :9090
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-moss-admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-not-configured}
    volumes:
      - ${MOSS_SERVER_HOME}/silo-data:/data
      - ./scripts/silo-init.sh:/scripts/silo-init.sh:ro
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [moss-storage]

  server:
    image: ${MOSS_SERVER_IMAGE}
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MOSS_DB_USER: ${MOSS_DB_USER}
      MOSS_DB_PASSWORD: ${MOSS_DB_PASSWORD}
      HOME: /root
      MOSS_SERVER_HOME: ${MOSS_SERVER_HOME}
      MOSS_SERVER_ASSET_ROOT: ${MOSS_SERVER_HOME}/container-app
      MOSS_HOME: ${MOSS_SERVER_HOME}
      MOSS_CONFIG_DIR: ${MOSS_SERVER_HOME}
      MOSS_SERVER_CONFIG: ${MOSS_SERVER_HOME}/server.json
      MOSS_NODE_PATH: /opt/moss/node/bin/node
      MOSS_HIDE_BOOTSTRAP_SECRETS: "1"
      MOSS_NEW_API_ENABLED: ${MOSS_NEW_API_ENABLED:-0}
      MOSS_NEW_API_BASE_URL: ${MOSS_NEW_API_BASE_URL:-}
      MOSS_NEW_API_PUBLIC_BASE_URL: ${MOSS_NEW_API_PUBLIC_BASE_URL:-}
      MOSS_NEW_API_API_KEY: ${MOSS_NEW_API_API_KEY:-}
      MOSS_NEW_API_INITIAL_QUOTA: ${MOSS_NEW_API_INITIAL_QUOTA:-5000000}
      MOSS_NEW_API_DEFAULT_MODEL: ${MOSS_NEW_API_DEFAULT_MODEL:-gpt-6.1-sol}
      MOSS_NEW_API_FAST_MODEL: ${MOSS_NEW_API_FAST_MODEL:-gpt-6.1-sol}
      MOSS_OAUTH_WEB_CALLBACKS: ${MOSS_WEB_ORIGIN}/api/oauth/callback,${MOSS_WEB_ORIGIN}/api/oidc/callback
      MOSS_OIDC_TRUSTED_REDIRECT_URIS: ${MOSS_WEB_ORIGIN}/api/oidc/callback,${MOSS_NEW_API_PUBLIC_BASE_URL:-http://${MOSS_PUBLIC_HOST:-localhost}:3000}/oauth/oidc
      MOSS_OIDC_NEW_API_CLIENT_ID: ${MOSS_OIDC_NEW_API_CLIENT_ID:-new-api}
      MOSS_OIDC_NEW_API_CLIENT_SECRET: ${MOSS_OIDC_NEW_API_CLIENT_SECRET:-}
      MOSS_OIDC_WEB_CLIENT_ID: ${MOSS_OIDC_WEB_CLIENT_ID:-moss-web}
      MOSS_OIDC_WEB_CLIENT_SECRET: ${MOSS_OIDC_WEB_CLIENT_SECRET:-}
      MOSS_OIDC_DESKTOP_CLIENT_ID: ${MOSS_OIDC_DESKTOP_CLIENT_ID:-moss-desktop}
      NODE_ENV: production
      TZ: ${TZ}
    volumes:
      - ${MOSS_SERVER_HOME}:${MOSS_SERVER_HOME}
    expose:
      - "43127"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:43127/readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      moss-db:
      moss-storage:
      moss-server:
      moss-integration:
        aliases: [moss-server]

  nginx:
    image: ${NGINX_IMAGE}
    depends_on:
      server: { condition: service_healthy }
      web-gateway: { condition: service_healthy }
      new-api: { condition: service_healthy }
    ports:
      - ${MOSS_HTTPS_PORT}:443
      - "${MOSS_WEB_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    restart: unless-stopped
    networks: [moss-server]

volumes:
  moss-cloud-snapshots:
  moss-cloud-state:
  # pg_data:
  # mysql_data:
  # clickhouse_data:
