name: ${COMPOSE_PROJECT_NAME}

networks:
  moss-db:
    internal: true
  moss-storage:
    internal: true
  moss-server:
    driver: bridge
  moss-integration:
    name: ${MOSS_INTEGRATION_NETWORK}
    external: true

services:
  web-gateway:
    image: ${MOSS_WEB_IMAGE:-ghcr.io/baiguidong/moss-webui:latest}
    profiles: [web-cloud]
    user: "0:0"
    entrypoint: [node, /opt/moss/cloud/gateway.mjs]
    environment:
      MOSS_WEB_AUTH_SERVER: http://server:43127
      MOSS_WEB_IMAGE: ${MOSS_WEB_IMAGE:-ghcr.io/baiguidong/moss-webui:latest}
      MOSS_WEB_ORIGIN: ${MOSS_WEB_ORIGIN:-}
      MOSS_CLOUD_STATE: /state
      MOSS_CLOUD_MAX_USERS: ${MOSS_CLOUD_MAX_USERS:-20}
      MOSS_CLOUD_CPUS: ${MOSS_CLOUD_CPUS:-1}
      MOSS_CLOUD_MEMORY_MB: ${MOSS_CLOUD_MEMORY_MB:-1024}
      MOSS_CLOUD_PIDS: ${MOSS_CLOUD_PIDS:-512}
      MOSS_CLOUD_STARTUP_TIMEOUT_SECONDS: ${MOSS_CLOUD_STARTUP_TIMEOUT_SECONDS:-300}
    volumes:
      - moss-cloud-state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    mem_limit: 256m
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [moss-server]

  web-cloud-proxy:
    image: ${NGINX_IMAGE}
    profiles: [web-cloud]
    depends_on:
      web-gateway: { condition: service_healthy }
    ports:
      - "${MOSS_WEB_HTTPS_PORT:-8444}:443"
    volumes:
      - ./nginx-web-cloud.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    restart: unless-stopped
    networks: [moss-server]

  webui:
    image: ${MOSS_WEB_IMAGE:-ghcr.io/baiguidong/moss-webui:latest}
    profiles: [webui]
    environment:
      MOSS_WEB_AUTH_SERVER: http://server:43127
      MOSS_WEB_OWNER_ID: ${MOSS_WEB_OWNER_ID:-}
      MOSS_WEB_OWNER_ORG_ID: ${MOSS_WEB_OWNER_ORG_ID:-}
      MOSS_WEB_ORIGIN: ${MOSS_WEB_ORIGIN:-}
    volumes:
      - moss-web-home:/home/moss
    expose: ["43128"]
    shm_size: 256mb
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [moss-server]

  webui-proxy:
    image: ${NGINX_IMAGE}
    profiles: [webui]
    depends_on:
      webui: { condition: service_healthy }
    ports:
      - "${MOSS_WEB_HTTPS_PORT:-8444}:443"
    volumes:
      - ./nginx-webui.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    restart: unless-stopped
    networks: [moss-server]

  mysql:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: ${MOSS_DB_NAME}
      MYSQL_USER: ${MOSS_DB_USER}
      MYSQL_PASSWORD: ${MOSS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MOSS_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${MOSS_SERVER_HOME}/var/lib/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [moss-db]

  silo:
    image: ${MINIO_IMAGE}
    profiles: [cloud]
    command: server /data --console-address :9090
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-moss-admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-not-configured}
    volumes:
      - ${MOSS_SERVER_HOME}/silo-data:/data
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [moss-storage]

  silo-init:
    image: ${SILO_MC_IMAGE}
    profiles: [cloud-init]
    entrypoint: [/bin/sh, /scripts/silo-init.sh]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-moss-admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-not-configured}
      CLOUD_BUCKET: ${CLOUD_BUCKET:-moss-cloud-storage}
    volumes:
      - ./scripts/silo-init.sh:/scripts/silo-init.sh:ro
      - ${MOSS_SERVER_HOME}/var/run/cloud-init:/run/cloud-init:ro
    networks: [moss-storage]

  server:
    image: ${MOSS_SERVER_IMAGE}
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MOSS_DB_USER: ${MOSS_DB_USER}
      MOSS_DB_PASSWORD: ${MOSS_DB_PASSWORD}
      HOME: /root
      MOSS_SERVER_HOME: ${MOSS_SERVER_HOME}
      MOSS_SERVER_ASSET_ROOT: ${MOSS_SERVER_HOME}/container-app
      MOSS_HOME: ${MOSS_SERVER_HOME}
      MOSS_CONFIG_DIR: ${MOSS_SERVER_HOME}
      MOSS_SERVER_CONFIG: ${MOSS_SERVER_HOME}/server.json
      MOSS_NODE_PATH: /opt/moss/node/bin/node
      MOSS_HIDE_BOOTSTRAP_SECRETS: "1"
      NODE_ENV: production
      TZ: ${TZ}
    volumes:
      - ${MOSS_SERVER_HOME}:${MOSS_SERVER_HOME}
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "43127"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:43127/readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      moss-db:
      moss-storage:
      moss-server:
      moss-integration:
        aliases: [moss-server]

  nginx:
    image: ${NGINX_IMAGE}
    depends_on:
      server: { condition: service_healthy }
    ports:
      - ${MOSS_HTTPS_PORT}:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    restart: unless-stopped
    networks: [moss-server]

volumes:
  moss-cloud-state:
  moss-web-home:
