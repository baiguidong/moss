version: '3.8'

services:
  moss-server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    container_name: moss-admin-hub
    restart: always
    ports:
      - "43127:43127"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/root/.moss/server
      - ./nexus-data:/root/.moss/nexus
      - .:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://hk.sudorouter.ai}
    networks:
      - moss-network

networks:
  moss-network:
    name: moss-network
